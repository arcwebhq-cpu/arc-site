name: ARC site quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: arcwebhq-cpu/arc-previews
          ref: 3662cab913571c02a55e722df037be5095e74cf4
          path: .arc-previews-contract
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          ARC_PREVIEWS_DIR: .arc-previews-contract

  production-route-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 7
    concurrency:
      group: arc-site-production-route-smoke
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm run build
        env:
          ARC_BUILD_INTAKE_ENABLED: ${{ vars.ARC_BUILD_INTAKE_ENABLED }}
      - run: node scripts/verify-production-routes.mjs
        env:
          ARC_EXPECTED_DEPLOY_SHA: ${{ github.sha }}
          ARC_BUILD_INTAKE_ENABLED: ${{ vars.ARC_BUILD_INTAKE_ENABLED }}
