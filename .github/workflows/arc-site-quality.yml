name: ARC site quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: arcwebhq-cpu/arc-previews
          ref: 4f1c75eed56046e79754978ffe3f433c79099d77
          path: .arc-previews-contract
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          ARC_PREVIEWS_DIR: .arc-previews-contract
