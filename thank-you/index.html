<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#060606">
  <title>Request received — ARC</title>
  <link rel="icon" href="/favicon.svg?v=8" type="image/svg+xml">
  <style>
    :root{--paper:#f3efe6;--ink:#090909;--muted:#736d63;--ease:cubic-bezier(.2,.72,.12,1)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:#060606;color:var(--paper);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    main{width:min(760px,100%);padding:clamp(30px,6vw,72px);border:1px solid rgba(255,255,255,.14);border-radius:42px;background:#101010;box-shadow:0 40px 120px rgba(0,0,0,.45)}
    svg{width:58px;height:38px;margin-bottom:42px}
    path{fill:none;stroke:currentColor;stroke-width:18;stroke-linecap:round;stroke-linejoin:round}
    .kicker{margin:0 0 18px;color:#aaa49b;font-size:13px;font-weight:900;letter-spacing:.15em;text-transform:uppercase}
    h1{max-width:650px;margin:0;font-size:clamp(52px,9vw,96px);line-height:.88;letter-spacing:-.065em}
    p{max-width:570px;margin:28px 0 0;color:#cfc9bf;font-size:clamp(18px,2.6vw,24px);line-height:1.35;font-weight:730;letter-spacing:-.025em}
    .next{display:grid;gap:10px;margin-top:28px;padding:18px 0;border-block:1px solid rgba(255,255,255,.12);color:#d6d0c6;font-weight:760}.next span{display:flex;gap:10px}.next b{color:#d8f76c}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:52px;margin-top:28px;padding:0 22px;border-radius:999px;background:var(--paper);color:var(--ink);font-weight:900;text-decoration:none;transition:transform .25s var(--ease)}
    a:hover{transform:translateY(-3px)}
    @media(max-width:600px){main{border-radius:30px}h1{font-size:clamp(44px,14vw,56px)}}
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 120 72" role="img" aria-label="ARC"><path d="M18 56 C18 26 39 14 60 14 C81 14 102 26 102 56"/></svg>
    <p class="kicker">Request received</p>
    <h1>Your preview is in motion.</h1>
    <p>We have your build brief. Watch the email you submitted for your unlisted ARC website preview and next steps.</p>
    <div class="next" role="list" aria-label="What happens next"><span role="listitem"><b>1.</b> Check your inbox for confirmation.</span><span role="listitem"><b>2.</b> Open the unlisted preview link when it arrives.</span><span role="listitem"><b>3.</b> Pay only if you approve the website.</span></div>
    <a href="/">Back to ARC</a>
  </main>
  <script>
  (async()=>{
    try{
      const pendingKey='arc-pending-preview-analytics',raw=sessionStorage.getItem(pendingKey);
      if(raw){
        const pending=JSON.parse(raw),expiresAt=Number(pending?.expires_at);
        if(Number.isFinite(expiresAt)&&expiresAt>Date.now()){
          const {expires_at,...payload}=pending;
          const response=await fetch('/api/analytics/event',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload),credentials:'omit',keepalive:true});
          if(response.ok)sessionStorage.removeItem(pendingKey);
        }else sessionStorage.removeItem(pendingKey);
      }
    }catch(error){}
    try{localStorage.removeItem('arc-preview-draft-v7');localStorage.removeItem('arc-preview-draft-v4');localStorage.removeItem('arc-preview-draft-v3')}catch(error){}
  })();
  </script>
</body>
</html>
